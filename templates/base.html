<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pokédex Yo-kai Watch</title>
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <header class="site-header">
        <nav>
            <a class="brand" href="{{ url_for('index') }}">Pokédex Yo-kai Watch</a>
            <a href="{{ url_for('index') }}">Listado</a>
            <a href="{{ url_for('favorites') }}">Mis favoritos</a>
            <a href="{{ url_for('guess_yokai_game') }}">¿Quién es ese Yokai?</a>
            <a href="{{ url_for('add') }}">Crear</a>
            <a href="{{ url_for('stats') }}">Estadísticas</a>
            <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Cambiar a modo oscuro" title="Cambiar a modo oscuro">
                <span id="theme-icon" aria-hidden="true">☾</span>
            </button>
        </nav>
    </header>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="messages">
                    {% for category, message in messages %}
                        <p class="message {{ category }}">{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>
</body>
</html>
